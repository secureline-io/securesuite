# Workspace manifest for the SecureSuite engine.
# Platform crates are AGPL-3.0-or-later (see ../LICENSE).
[workspace]
resolver = "2"
members = ["engine/crates/*"]
# The desktop window is its own workspace (it needs GUI system libraries).
exclude = ["desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["SecureSuite Contributors"]
repository = "https://github.com/secureline-io/securesuite"
rust-version = "1.86"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
